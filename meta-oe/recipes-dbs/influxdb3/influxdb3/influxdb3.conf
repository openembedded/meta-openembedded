# Settings for 'influxdb3 serve', read by the systemd service and the init
# script. Any INFLUXDB3_* variable listed by 'influxdb3 serve --help' can be
# set here.

# Identifier of this node, used as prefix in the object store.
INFLUXDB3_NODE_ID=node0

# Object store type and its directory for the 'file' store.
INFLUXDB3_OBJECT_STORE=file
INFLUXDB3_DATA_DIR=/var/lib/influxdb3/data

# Directory of processing engine plugins; setting it enables the Python
# processing engine, which creates a virtual environment in it with pip.
#INFLUXDB3_PLUGIN_DIR=/var/lib/influxdb3/plugins

# Address to serve HTTP and gRPC requests on.
#INFLUXDB3_HTTP_BIND_ADDR=0.0.0.0:8181

# Extra command line options for 'influxdb3 serve'.
INFLUXDB3_OPTS=
